# Bluetooth audio tuning primarily for the Bose QC Ultra headphones.
#
# The goal is to always come up on high-quality A2DP and never the
# telephone-quality HSP/HFP headset profile.
#
# Disabling the HFP/HSP backend stops WirePlumber from registering the headset
# endpoints with bluetoothd, so nothing on this machine claims the profile and
# the headphones can only ever connect as A2DP. BlueZ itself still supports
# HSP/HFP and the device keeps advertising those UUIDs, there is simply no
# longer anything to hand the profile to. That removes the whole class of
# "connected but telephone-quality" and auto-switch-to-headset problems. It does
# not address A2DP failing to come up at all, which is a separate BlueZ issue.
#
# The cost is the Bluetooth microphone, which these headphones are not used for.
# Note that monitor.bluez.properties applies to every Bluetooth audio device, so
# any future headset loses its microphone here as well.
#
# NOTE: Do not set session.suspend-timeout-seconds = 0 on bluez_output nodes.
# Suspend is not the same as disconnect since a suspended node stays
# A2DP-connected and just pauses the stream. Pinning the node open (timeout 0)
# instead keeps the Bluetooth transport fd held permanently, so when headphones
# sleep or there's a multipoint hand-off to the phone the node flips to a stuck
# "error" state that only a full PipeWire stack restart clears. Leaving suspend
# at the default lets WirePlumber recover the transport cleanly.

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.codecs = [ sbc_xq sbc ]
  bluez5.hfphsp-backend = none
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
